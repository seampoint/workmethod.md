name: Source and packaging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-packaging:
    name: Source and packaging checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source and example baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # verify-source.py compares examples with their historical baseline.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify source
        run: python3 tools/verify-source.py
      - name: Build and verify packages
        run: python3 tools/build-package.py
      - name: Verify reproducible packages
        shell: bash
        run: |
          sha256sum dist/* > "$RUNNER_TEMP/workmethod-package.sha256"
          python3 tools/build-package.py
          sha256sum --check "$RUNNER_TEMP/workmethod-package.sha256"
      - name: Verify tracked source was not modified
        run: git diff --exit-code
